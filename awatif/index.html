<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b1830">
<title>عواطف الجهني · ملف الإنجاز 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --plum:#2b1830; --plum-2:#3a2140; --plum-3:#4a2c50; --mauve:#9b6b93; --mauve-d:#7d4f78; --rose:#d9a5b3; --gold:#d8bd8a; --cream:#f7f1ec;
    --muted:#c9b3c3; --line:rgba(216,189,138,.22); --glass:rgba(255,255,255,.05);
    --ease:cubic-bezier(.2,.8,.2,1); --soft:cubic-bezier(.34,1.3,.64,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--plum);color:var(--cream);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;font-size:17px;line-height:1.8;overflow:hidden;-webkit-tap-highlight-color:transparent}
  h1,h2,h3,h4,.serif{font-family:"El Messiri","IBM Plex Sans Arabic",serif;line-height:1.35}
  a{color:inherit;text-decoration:none} button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
  :focus-visible{outline:2px solid var(--gold);outline-offset:4px;border-radius:12px}

  /* ===== الخلفية: نجوم وتوهج ===== */
  #sky{position:fixed;inset:0;z-index:0}
  .glow{position:fixed;border-radius:50%;filter:blur(90px);pointer-events:none;z-index:0}
  .g1{width:60vw;height:60vw;max-width:760px;max-height:760px;background:var(--mauve);opacity:.38;left:-18vw;bottom:-30vw;animation:drift 18s ease-in-out infinite}
  .g2{width:40vw;height:40vw;max-width:520px;max-height:520px;background:var(--gold);opacity:.13;right:-10vw;top:-16vw;animation:drift 22s ease-in-out infinite reverse}
  @keyframes drift{50%{transform:translate(4vw,-3vw)}}

  /* ===== الإطار العام ===== */
  .top{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:max(18px,env(safe-area-inset-top)) clamp(16px,4vw,48px) 0}
  body.inner .top{background:linear-gradient(180deg,rgba(43,24,48,.96) 55%,rgba(43,24,48,0));padding-bottom:22px}
  .top{transition:background .4s}
  .mono{display:flex;align-items:center;gap:10px;font-family:"El Messiri";font-size:19px;color:var(--gold)}
  .mono i{width:38px;height:38px;border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center;font-style:normal;font-size:18px}
  .ctrl{display:flex;gap:8px}
  .ic-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(10px);display:grid;place-items:center;transition:background .3s,transform .3s var(--soft)}
  .ic-btn:hover{background:rgba(216,189,138,.12);transform:scale(1.06)}
  .ic-btn svg{width:20px;height:20px;stroke:var(--cream);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

  /* ===== الشاشة الرئيسية ===== */
  #home{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .6s var(--ease),transform .7s var(--ease)}
  #home.away{opacity:0;transform:scale(.94);pointer-events:none}
  .intro{text-align:center;margin-top:min(4vh,40px)}
  .kicker{font-size:14px;letter-spacing:3px;color:var(--muted);opacity:0;animation:fadeUp .9s .2s var(--ease) forwards}
  .quote{position:relative;min-height:2.7em;font-size:clamp(1.7rem,4.6vw,3.3rem);font-weight:700;color:var(--cream);margin:8px auto 0;max-width:min(92vw,900px);display:grid;place-items:center;line-height:1.35}
  .quote span{grid-area:1/1;opacity:0;transform:translateY(16px);filter:blur(8px);transition:opacity 1s var(--ease),transform 1.1s var(--ease),filter 1s var(--ease)}
  .quote span.on{opacity:1;transform:none;filter:none}
  .quote span.out{opacity:0;transform:translateY(-14px);filter:blur(8px)}
  .quote em{font-style:normal;color:var(--gold)}
  .sign{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:clamp(8px,1.6vh,16px);opacity:0;animation:fadeUp 1s .9s var(--ease) forwards}
  .sign i{width:clamp(30px,7vw,70px);height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
  .sign i:last-child{background:linear-gradient(90deg,var(--gold),transparent)}
  .sign i::after{content:"";display:block;width:5px;height:5px;margin-top:-2px;border-radius:50%;background:var(--gold);transform:rotate(45deg)}
  .sign i:first-child::after{margin-right:auto} .sign i:last-child::after{margin-left:auto}
  .name{font-size:clamp(1.5rem,3.4vw,2.3rem);font-weight:600;letter-spacing:1.5px;background:linear-gradient(90deg,#c9a96a,#f3e2bd,#c9a96a);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
  @keyframes shine{to{background-position:-200% 0}}
  .qdots{display:flex;gap:6px;justify-content:center;margin-top:10px}
  .qdots b{width:5px;height:5px;border-radius:50%;background:rgba(247,241,236,.25);transition:.5s}
  .qdots b.on{background:var(--gold);transform:scale(1.4)}
  .role{color:var(--muted);font-size:clamp(.95rem,2vw,1.1rem);opacity:0;animation:fadeUp .9s 1s var(--ease) forwards}
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @keyframes reveal{to{opacity:1;transform:none;filter:none}}

  /* القوس الدوّار */
  .arc{position:relative;width:100%;height:clamp(250px,40vh,360px);margin-top:clamp(18px,4vh,46px);perspective:1100px;touch-action:pan-y;cursor:grab;user-select:none;opacity:0;animation:fadeUp 1s 1.2s var(--ease) forwards}
  .arc.drag{cursor:grabbing}
  .card{position:absolute;left:50%;top:50%;width:var(--cw);height:var(--ch);margin:calc(var(--ch)/-2) 0 0 calc(var(--cw)/-2);border-radius:22px;padding:22px;
        display:flex;flex-direction:column;justify-content:space-between;text-align:right;overflow:hidden;will-change:transform,opacity;
        box-shadow:0 30px 60px rgba(10,4,12,.5),inset 0 0 0 1px rgba(255,255,255,.12);transition:box-shadow .4s}
  :root{--cw:clamp(190px,22vw,260px);--ch:clamp(230px,28vw,310px)}
  .card::before{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.18),transparent 40%);pointer-events:none}
  .card .no{font-family:"El Messiri";font-size:14px;opacity:.75;letter-spacing:1px}
  .card .ico{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.14);margin-bottom:auto;margin-top:12px}
  .card .ico svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
  .card h3{font-size:clamp(1.15rem,2vw,1.45rem);font-weight:700}
  .card small{font-size:14px;opacity:.85}
  .card.on{box-shadow:0 34px 70px rgba(10,4,12,.6),0 0 0 1.5px var(--gold),0 0 40px rgba(216,189,138,.25)}
  .card .open{position:absolute;left:18px;bottom:18px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;opacity:0;transform:scale(.6);transition:.4s var(--soft)}
  .card.on .open{opacity:1;transform:none}
  .card .open svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}

  .nav{display:flex;align-items:center;gap:18px;margin-top:clamp(14px,3vh,30px);opacity:0;animation:fadeUp 1s 1.4s var(--ease) forwards}
  .dots{display:flex;gap:8px}
  .dots button{width:8px;height:8px;border-radius:99px;background:rgba(247,241,236,.25);transition:width .4s var(--ease),background .4s}
  .dots button.on{width:26px;background:var(--gold)}
  .hint{margin-top:10px;font-size:13px;color:var(--muted);opacity:0;animation:fadeUp 1s 1.8s var(--ease) forwards}

  /* ===== صفحة القسم ===== */
  #page{position:fixed;inset:0;z-index:10;overflow-y:auto;overscroll-behavior:contain;opacity:0;pointer-events:none;transform:translateY(30px);transition:opacity .5s var(--ease),transform .6s var(--ease)}
  #page.on{opacity:1;pointer-events:auto;transform:none}
  .wrap{max-width:1080px;margin:0 auto;padding:0 clamp(16px,4vw,32px)}
  .phead{padding:110px 0 30px;text-align:center}
  .phead .ico{width:74px;height:74px;margin:0 auto 14px;border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center;color:var(--gold)}
  .phead .ico svg{width:32px;height:32px;stroke:currentColor;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
  .phead h2{font-size:clamp(2rem,5vw,3.2rem);color:var(--gold)}
  .phead p{color:var(--muted);max-width:620px;margin:6px auto 0}
  .phead .goal{display:inline-block;margin-top:14px;border:1px solid var(--line);border-radius:99px;padding:4px 16px;font-size:14px;color:var(--rose)}
  .pbody{padding-bottom:90px}
  .rise{opacity:0;transform:translateY(22px);animation:fadeUp .8s var(--ease) forwards}

  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:30px}
  .kpi{border:1px solid var(--line);background:var(--glass);border-radius:20px;padding:18px;text-align:center;backdrop-filter:blur(8px)}
  .kpi b{display:block;font-family:"El Messiri";font-size:clamp(1.6rem,4vw,2.3rem);color:var(--gold);line-height:1.3}
  .kpi span{font-size:14px;color:var(--muted)}

  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  @media (max-width:860px){.grid{grid-template-columns:repeat(2,1fr)}}
  @media (max-width:560px){.grid{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}.kpis>:last-child{grid-column:1/-1}}
  .item{text-align:right;border:1px solid var(--line);background:var(--glass);border-radius:22px;overflow:hidden;backdrop-filter:blur(8px);transition:transform .45s var(--soft),border-color .3s}
  .item:hover{transform:translateY(-6px);border-color:rgba(216,189,138,.5)}
  .item .cv{height:130px;position:relative;display:grid;place-items:center;background:var(--bg)}
  .item .cv svg{width:44px;height:44px;stroke:var(--fg,#fff);fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;transition:transform .5s var(--soft)}
  .item:hover .cv svg{transform:scale(1.15)}
  .item .tx{padding:14px 16px 16px}
  .item h3{font-size:17px}
  .item p{font-size:14.5px;color:var(--muted)}
  .item .ft{display:flex;justify-content:space-between;margin-top:10px;font-size:13.5px}
  .item .ft .ok{color:var(--rose)} .item .ft .go{color:var(--gold)}

  .rows{display:flex;flex-direction:column;gap:12px}
  .row{display:grid;grid-template-columns:56px 1fr auto;gap:16px;align-items:center;border:1px solid var(--line);background:var(--glass);border-radius:20px;padding:14px 18px;backdrop-filter:blur(8px);transition:transform .4s var(--soft),border-color .3s}
  .row:hover{transform:translateX(-6px);border-color:rgba(216,189,138,.5)}
  .row .ri{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--bg)}
  .row .ri svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
  .row h3{font-size:16.5px}
  .row p{font-size:14.5px;color:var(--muted)}
  .row .go{color:var(--gold);font-size:14px;white-space:nowrap}
  @media (max-width:560px){.row{grid-template-columns:48px 1fr}.row .go{display:none}.row .ri{width:48px;height:48px}}

  .h3{display:flex;align-items:center;gap:10px;font-family:"El Messiri";font-size:1.4rem;color:var(--gold);margin:38px 0 14px}
  .h3::before{content:"";width:22px;height:1px;background:var(--gold)}
  .box{border:1px solid var(--line);background:var(--glass);border-radius:22px;padding:22px;backdrop-filter:blur(8px)}
  .m{margin-bottom:18px}.m:last-child{margin:0}
  .m .t{display:flex;justify-content:space-between;margin-bottom:8px;font-size:15.5px}
  .m .t b{font-family:"El Messiri";color:var(--gold)}
  .m .tr{height:8px;border-radius:99px;background:rgba(247,241,236,.1);overflow:hidden}
  .m .tr span{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--gold),var(--rose));transition:width 1.8s var(--ease)}
  .kpi b span{font-size:inherit;color:inherit}
  .lines{display:grid;gap:12px}
  .line{position:relative;border-right:2px solid var(--gold);padding:10px 18px;font-family:"El Messiri";font-size:clamp(1.1rem,2.6vw,1.4rem);background:linear-gradient(90deg,transparent,rgba(216,189,138,.08));border-radius:12px 0 0 12px}
  .skills{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  @media (max-width:760px){.skills{grid-template-columns:1fr 1fr}}
  @media (max-width:420px){.skills{grid-template-columns:1fr}}
  .skill{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--glass);border-radius:18px;padding:14px 16px;font-weight:500;transition:transform .4s var(--soft),border-color .3s,box-shadow .3s}
  .skill:hover{transform:translateY(-4px);border-color:rgba(216,189,138,.55);box-shadow:0 0 24px rgba(216,189,138,.15)}
  .si{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--gold),#e6cfa5);color:var(--plum)}
  .si svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .hobby{display:flex;gap:16px;align-items:center;border:1px solid rgba(216,189,138,.4);background:var(--glass);border-radius:22px;padding:20px}
  .hobby .si{width:56px;height:56px;background:linear-gradient(135deg,var(--rose),var(--mauve));color:#fff;animation:beatS 1.8s ease-in-out infinite}
  @keyframes beatS{0%,100%{transform:scale(1)}20%{transform:scale(1.1)}40%{transform:scale(.97)}}
  .hobby b{font-family:"El Messiri";font-size:1.25rem;color:var(--gold)}
  .hobby p{color:var(--muted)}
  .steps{display:flex;align-items:stretch;gap:10px;margin-bottom:10px}
  .step{flex:1;border:1px solid var(--line);background:var(--glass);border-radius:20px;padding:16px;text-align:center}
  .step:last-child{border-color:rgba(216,189,138,.6);box-shadow:0 0 30px rgba(216,189,138,.12)}
  .step .yr{display:inline-block;font-family:"El Messiri";color:var(--plum);background:var(--gold);border-radius:99px;padding:0 12px;font-size:14px}
  .step b{display:block;font-family:"El Messiri";font-size:1.15rem;margin-top:8px}
  .step small{color:var(--muted)}
  .arr{align-self:center;color:var(--gold);font-size:22px}
  @media (max-width:640px){.steps{flex-direction:column}.arr{transform:rotate(-90deg)}}
  .soon{border:1px dashed rgba(216,189,138,.4);border-radius:22px;padding:26px;text-align:center;color:var(--muted)}
  .soon b{display:block;font-family:"El Messiri";color:var(--rose);font-size:18px}
  .ba{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center}
  .ba .side{border:1px solid var(--line);border-radius:22px;padding:20px;background:var(--glass)}
  .ba .side.new{border-color:rgba(216,189,138,.5)}
  .ba .lbl{display:inline-block;font-size:12.5px;padding:2px 12px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
  .ba .side.new .lbl{color:var(--plum);background:var(--gold);border-color:var(--gold)}
  .ba h4{font-family:"El Messiri";font-size:18px;margin:6px 0}
  .ba ul{padding-right:18px;color:var(--muted);font-size:15px}
  .ba .mid{color:var(--gold);font-size:26px}
  @media (max-width:700px){.ba{grid-template-columns:1fr}.ba .mid{justify-self:center;transform:rotate(-90deg)}}

  /* النافذة */
  .modal{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:16px;background:rgba(20,8,22,.6);backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .35s}
  .modal.on{opacity:1;pointer-events:auto}
  .sheet{position:relative;width:100%;max-width:520px;max-height:88vh;overflow:auto;border-radius:26px;background:linear-gradient(180deg,var(--plum-3),var(--plum-2));border:1px solid var(--line);transform:translateY(24px) scale(.96);transition:transform .5s var(--soft)}
  .modal.on .sheet{transform:none}
  .sheet .cv{height:160px;display:grid;place-items:center;background:var(--bg)}
  .sheet .cv.vid{height:auto;aspect-ratio:16/9;background:#000}
  .sheet .cv iframe{width:100%;height:100%;border:0;display:block}
  .item .cv .play{position:absolute;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.5);display:grid;place-items:center;backdrop-filter:blur(6px)}
  .sheet .cv svg{width:60px;height:60px;stroke:#fff;fill:none;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
  .sheet .x{position:absolute;top:14px;right:14px}
  .sheet .in{padding:20px 22px 24px}
  .sheet h3{font-size:22px;color:var(--gold)}
  .sheet p{color:var(--muted)}
  .sheet ul{margin:12px 0;padding-right:20px}
  .sheet .who{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 18px}
  .sheet .who span{border:1px solid var(--line);border-radius:99px;padding:2px 12px;font-size:13px;color:var(--muted)}
  .cta{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:16px;background:linear-gradient(90deg,var(--gold),#e6cfa5);color:var(--plum);font-weight:700;transition:transform .3s var(--soft)}
  .cta:hover{transform:scale(1.02)}
  .cta.alt{margin-top:10px;background:transparent;color:var(--gold);border:1px solid var(--gold)}
  .cta[hidden]{display:none}

  .back{position:fixed;top:max(18px,env(safe-area-inset-top));left:clamp(16px,4vw,48px);z-index:25;display:flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:99px;border:1px solid var(--line);background:rgba(43,24,48,.6);backdrop-filter:blur(10px);opacity:0;pointer-events:none;transform:translateX(-10px);transition:.4s var(--ease)}
  body.inner .back{opacity:1;pointer-events:auto;transform:none}
  body.inner .ctrl .home-only{display:none}
  .back svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8}


  /* ===== الصفحة الرئيسية قابلة للنزول: العارض ثم رحلة الخيط الذهبي ===== */
  #home{display:block;overflow-y:auto;overflow-x:clip;overscroll-behavior:contain;scrollbar-width:none}
  #home::-webkit-scrollbar{display:none}
  .first{position:relative;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:86px 0 40px}
  @media (min-width:701px) and (max-height:980px){.first{padding-top:64px}.arc{height:clamp(240px,33vh,330px);margin-top:clamp(14px,3vh,30px)}}
  #fx{position:fixed;inset:0;z-index:3;pointer-events:none}
  #bar{position:fixed;top:0;right:0;height:2px;z-index:25;background:linear-gradient(90deg,var(--gold),var(--rose));width:0}
  #home.away ~ #bar, body.inner #bar{opacity:0}
  .cue{position:relative;margin-top:22px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
  .cue span{width:24px;height:38px;border:1.5px solid var(--gold);border-radius:14px;position:relative}
  .cue span::after{content:"";position:absolute;left:50%;top:8px;width:4px;height:8px;margin-left:-2px;border-radius:4px;background:var(--gold);animation:wheel 1.6s ease-in-out infinite}
  @keyframes wheel{0%{opacity:0;transform:translateY(-4px)}40%{opacity:1}100%{opacity:0;transform:translateY(12px)}}

  .cue{opacity:0;animation:fadeUp 1s 2.2s var(--ease) forwards}
  :root{--gold-2:#f3e2bd}
  #journey{position:relative;z-index:2;max-width:1100px;margin:0 auto;padding:10vh 16px 18vh}
  #journey #thread{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
  #journey #thread .base{fill:none;stroke:rgba(216,189,138,.12);stroke-width:1.5}
  #journey #thread .live{fill:none;stroke:url(#gold);stroke-width:2.6;stroke-linecap:round;filter:drop-shadow(0 0 6px rgba(243,226,189,.65))}
  #journey .ch{position:relative;min-height:78vh;display:flex;align-items:center}
  #journey .ch .in{width:min(600px,100%);position:relative;display:flex;gap:28px;align-items:flex-start}
  #journey .ch .txt{flex:1;min-width:0}
  #journey .ch:nth-child(odd) .in{margin-right:4%}
  #journey .ch:nth-child(even) .in{margin-right:auto;margin-left:4%;flex-direction:row-reverse;text-align:left}
  #journey .ch:nth-child(even) .in .txt{direction:rtl;text-align:right}

(function sky() {

  }
  sparks = sparks.filter(s => (s.life -= .022) > 0);
  for (const s of sparks) { s.x += s.vx; s.y += s.vy; cx.globalAlpha = s.life; cx.fillStyle = s.life > .5 ? "#f3e2bd" : "#d9a5b3"; cx.beginPath(); cx.arc(s.x, s.y, s.r, 0, 7); cx.fill(); }
  cx.globalAlpha = 1;

  // إضاءة الأقسام حين يصلها الخيط
  const chs = document.querySelectorAll(".ch");
  anchors.forEach((a, i) => {
    const reached = samples.length && head >= a.y;
    chs[i].classList.toggle("lit", reached);
    if (reached && i > lastLit) { lastLit = i; chime([880, 1318.5], .08, .045); }
    if (!reached && i <= lastLit) lastLit = i - 1;
  });
  const done = lenNow > L - 4 && heartT;
  if (done && !heartDone) { heartDone = true; chime([659.3, 880, 1046.5, 1318.5], .09, .05); }
  if (!heartT) heartDone = false;
  $("#end").classList.toggle("done", !!done);
  requestAnimationFrame(frame);
}

function init() { sizeFx(); build(); }
addEventListener("resize", init);
document.fonts.ready.then(() => { init(); requestAnimationFrame(frame); });
setTimeout(init, 1500);
})();

route();
</script>
